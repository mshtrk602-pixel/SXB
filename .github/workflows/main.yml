name: 24/7 Master Broadcast

on:
  workflow_dispatch:
    inputs:
      kick_channel:
        description: 'اسم قناة كيك (Kick Channel)'
        required: true
        default: 'AbuSwe7l'
      youtube_key:
        description: 'مفتاح بث يوتيوب (تأكّد من إدخاله صح)'
        required: false
        default: ''
      restream_key:
        description: 'مفتاح بث ريستريم'
        required: false
        default: 're_12389500_eventbc60ad40fd184deea7c2ae0d5c6d196d'
      destination:
        description: 'وجهة البث (youtube, restream, both)'
        required: true
        default: 'restream'
      quality:
        description: 'جودة البث'
        required: true
        default: 'best'
  schedule:
    # تشغيل تلقائي كل 5 ساعات لضمان استمرارية البث وتخطي حد الـ 6 ساعات
    - cron: '0 */5 * * *'

concurrency:
  group: kick-broadcast
  cancel-in-progress: true

jobs:
  broadcaster:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: جلب ملفات المستودع
        uses: actions/checkout@v3

      - name: تثبيت FFmpeg و Streamlink والخطوط والمكتبات
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip fonts-noto-core fonts-sil-scheherazade fontconfig libass-dev
          sudo pip3 install --upgrade streamlink
          sudo fc-cache -f -v

      - name: تشغيل سكربت البث الشامل
        env:
          KICK_CHANNEL: ${{ github.event.inputs.kick_channel || 'PEERLESS' }}
          YOUTUBE_KEY: ${{ github.event.inputs.youtube_key || '' }}
          RESTREAM_KEY: ${{ github.event.inputs.restream_key || 're_12394050_eventb0c61bd69bcd4207a19d91e5f4a74f69' }}
          STREAM_DEST: ${{ github.event.inputs.destination || 'restream' }}
          STREAM_QUALITY: ${{ github.event.inputs.quality || 'best' }}
        run: |
          chmod +x stream.sh
          ./stream.sh
